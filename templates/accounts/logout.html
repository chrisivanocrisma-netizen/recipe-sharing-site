{% extends 'base.html' %}

{% block title %}Logout - Recipe Sharing{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 100px auto; text-align: center;">
    <div style="background: white; padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow);">
        <div style="font-size: 48px; margin-bottom: 20px;">👋</div>
        <h1 style="margin-bottom: 10px;">Goodbye!</h1>
        <p style="color: var(--text-light); margin-bottom: 30px;">
            You have been successfully logged out.
        </p>
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <a href="{% url 'login' %}" style="display: block; padding: 12px; background: var(--gradient-primary); color: white; border-radius: var(--radius); text-decoration: none; font-weight: 600;">
                Login Again
            </a>
            <a href="{% url 'home' %}" style="display: block; padding: 12px; background: var(--bg-light); color: var(--text-dark); border-radius: var(--radius); text-decoration: none; font-weight: 600;">
                Go to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
